<!DOCTYPE html>
<html lang="pt" data-active-lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Obra — Maria da Luz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
</head>
<body>

  <!-- Icon sprite -->
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false">
    <symbol id="icon-zoom" viewBox="0 0 24 24"><path fill="currentColor" d="M.346 23.61a1.098 1.098 0 0 1-.361-.819c0-.337.12-.65.36-.88l5.294-5c-1.564-1.855-2.406-4.192-2.286-6.602C3.353 4.623 7.925-.052 13.7-.052c5.654 0 10.345 4.675 10.345 10.361 0 5.687-4.691 10.362-10.345 10.362a10.32 10.32 0 0 1-6.256-2.096L2.03 23.659c-.24.217-.481.337-.842.337-.36 0-.601-.144-.842-.385zm5.293-13.3c0 4.36 3.609 7.951 7.94 7.951 4.45 0 7.939-3.59 7.939-7.952 0-4.361-3.489-7.952-7.94-7.952-4.33 0-7.94 3.59-7.94 7.952zm7.218 2.59v-1.807h-1.805c-.481 0-.842-.41-.842-.904v-.012c0-.494.361-.892.842-.904h1.805V7.466c.12-.494.48-.892.962-.904.481.012.842.41.842.904v1.807h1.804c.602 0 .963.41.963.904 0 .506-.361.916-.963.916h-1.804V12.9c.12.494-.36.903-.842.903-.481 0-.962-.41-.842-.903h-.12z"/></symbol>
    <symbol id="icon-scale" viewBox="0 0 24 24"><path fill="currentColor" d="M15.9 1h-8a1 1 0 0 0 0 2h7v3h-4a1 1 0 0 0 0 2h4v3h-7a1 1 0 0 0 0 2h7v3h-4a1 1 0 0 0 0 2h4v3h-7a1 1 0 1 0 0 2h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1z"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path fill="currentColor" d="m13.7 12 9.16 9.16c.56.57.64 1.4.17 1.87-.47.47-1.3.4-1.87-.17L12 13.7l-9.16 9.16c-.57.56-1.4.64-1.87.17-.47-.47-.4-1.3.17-1.87L10.3 12 1.14 2.84C.58 2.27.5 1.44.97.97c.47-.47 1.3-.4 1.87.17L12 10.3l9.16-9.16c.57-.56 1.4-.64 1.87-.17.47.47.4 1.3-.17 1.87L13.7 12z"/></symbol>
    <symbol id="icon-size-up" viewBox="0 0 24 24"><path fill="currentColor" d="M1.48 24.022c-.377 0-.753-.163-1.004-.452-.251-.238-.377-.59-.377-.966v-7.53c0-.678.502-1.255 1.255-1.255.628 0 1.255.577 1.255 1.255v6.438h6.4c.754 0 1.256.565 1.256 1.255s-.502 1.255-1.255 1.255H1.48zm20.08-15.06V2.524h-6.4c-.754 0-1.256-.565-1.256-1.255S14.406.014 15.16.014h7.53c.753.062 1.381.665 1.381 1.405v7.53c0 .34-.125.653-.376.891-.252.226-.503.364-.879.364-.628 0-1.255-.564-1.255-1.255v.013z"/></symbol>
    <symbol id="icon-size-down" viewBox="0 0 24 24"><path fill="currentColor" d="M6.78 24c-.478 0-.956-.43-.956-.956v-4.89H.952c-.573 0-.955-.43-.955-.956s.382-.955.955-.955h5.732c.573.047 1.051.506 1.051 1.07v5.731a.917.917 0 0 1-.287.679.893.893 0 0 1-.668.277zm9.744-16.575c-.191-.181-.287-.449-.287-.735V.958c0-.249.096-.488.287-.67.19-.18.382-.286.669-.286.477 0 .955.43.955.956v4.9h4.872c.573 0 .955.43.955.956 0 .525-.382.955-.955.955h-5.732a1.096 1.096 0 0 1-.764-.344z"/></symbol>
    <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path fill="currentColor" d="M9.6 3.2 2.8 10a1.8 1.8 0 0 0 0 2.6l6.8 6.8a1.8 1.8 0 1 0 2.6-2.6l-4-4h11.3a1.8 1.8 0 1 0 0-3.6H8.2l4-4A1.8 1.8 0 0 0 9.6 3.2z"/></symbol>
  </svg>

  <!-- Top bar -->
  <header class="topbar">
    <a class="viewer-back" href="index.html#galeria">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#icon-arrow-left"></use></svg>
      <span data-lang="pt">Obras</span>
      <span data-lang="en">Works</span>
    </a>

    <div class="viewer-heading">
      <span class="viewer-title" id="barTitle"></span>
      <span class="viewer-size" id="barSize"></span>
    </div>

    <div class="lang-switch">
      <button type="button" data-set-lang="pt" class="active">PT</button>
      <button type="button" data-set-lang="en">EN</button>
    </div>
  </header>

  <!-- Artwork -->
  <main class="stage" id="stage">
    <div class="artwork-container" id="artworkContainer">
      <img id="artworkImg" alt="">

      <div class="artwork-buttons">
        <button class="btn-round" type="button" id="openZoom"
                aria-label="Ampliar obra" data-label-pt="Ampliar obra" data-label-en="Enlarge artwork">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#icon-zoom"></use></svg>
        </button>
        <button class="btn-round" type="button" id="openScale"
                aria-label="Ver dimensões reais" data-label-pt="Ver dimensões reais" data-label-en="See real-life size">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#icon-scale"></use></svg>
        </button>
      </div>
    </div>

    <div class="stage-caption">
      <div class="caption-title" id="capTitle"></div>
      <div class="caption-meta">
        <span id="capSize"></span><span data-lang="pt">clique na lupa para ampliar</span><span data-lang="en">click the magnifier to zoom</span>
      </div>
      <dl class="work-details" id="workDetails"></dl>
      <p class="work-description" id="workDescription"></p>
    </div>
  </main>

  <!-- Shown when the link has an unknown or missing id -->
  <main class="not-found" id="notFound" hidden>
    <p>
      <span data-lang="pt">Esta obra não foi encontrada.</span>
      <span data-lang="en">This artwork was not found.</span>
    </p>
    <a href="index.html#galeria">
      <span data-lang="pt">Voltar às obras</span>
      <span data-lang="en">Back to the works</span>
    </a>
  </main>

  <!-- Deep zoom -->
  <dialog class="popup" id="zoomDialog" aria-label="Ampliação da obra" data-label-pt="Ampliação da obra" data-label-en="Artwork close-up">
    <div class="popup-buttons">
      <button class="btn-round" type="button" id="zoomFullscreen"
              aria-label="Ecrã inteiro" data-label-pt="Ecrã inteiro" data-label-en="Fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#icon-size-up"></use></svg>
      </button>
      <button class="btn-round" type="button" id="zoomClose"
              aria-label="Fechar ampliação" data-label-pt="Fechar ampliação" data-label-en="Close viewer">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#icon-close"></use></svg>
      </button>
    </div>
    <div class="zoom-view" id="zoomView"></div>
  </dialog>

  <!-- Size comparison -->
  <dialog class="popup" id="sizeDialog" aria-label="Comparação de tamanho" data-label-pt="Comparação de tamanho" data-label-en="Size comparison">
    <div class="popup-buttons">
      <button class="btn-round" type="button" id="sizeClose"
              aria-label="Fechar dimensões" data-label-pt="Fechar dimensões" data-label-en="Close dimensions">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#icon-close"></use></svg>
      </button>
    </div>

    <div class="vfs">
      <div class="vfs-wrapper" id="vfsWrapper">
        <div class="vfs-painting" id="vfsPainting">
          <div class="vfs-dim-wrap" id="vfsPaintDim">
            <p class="vfs-dim-text" id="vfsPaintLabel"></p>
            <div class="vfs-dim"></div>
          </div>
          <img class="vfs-painting-img" id="vfsPaintImg" alt="">
        </div>

        <div class="vfs-person" id="vfsPerson">
          <span class="vfs-person-clip">
            <img class="vfs-person-img" src="images/silhouette_BW.png" alt="" aria-hidden="true" draggable="false">
          </span>
          <div class="vfs-dim-wrap" id="vfsPersonDim">
            <div class="vfs-dim"></div>
            <p class="vfs-dim-text" id="vfsPersonLabel"></p>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <script src="works.js" defer></script>
  <script src="site.js" defer></script>
  <script src="images/hq/index.js" defer></script>
  <script src="viewer.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/openseadragon@6.1.1/build/openseadragon/openseadragon.min.js" async></script>
</body>
</html>
